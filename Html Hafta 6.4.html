<script>
   for(a=1;a>0;a++){
    var x=prompt("Sıfırla 10 arasında bir sayı giriniz:","")
    try
    {
    if(x>10)
    throw "Err1";
    else if(x<0)
    throw "Err2";
    else
    throw "ErrorYok"
    }
    catch(er){
        if(er=="Err1"){
            alert("Error! Yuksek Sayı Girdiniz Lütfen Birdaha Deneyiniz.")
        }
        else if(er=="Err2"){
            alert("Error! Düşük Sayı Girdiniz Lütfen Birdaha Deneyiniz.")
        }
        else if(er=="ErrorYok")
          break;
    }
}
</script>
